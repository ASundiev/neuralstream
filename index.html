    /* Cleaned up tech borders without clip-path issues */
    .tech-border {
      border: 1px solid rgba(0, 245, 255, 0.15);
      position: relative;
    }

    /* 
       Replaced clip-path polygons with sharp borders and corner accents.
       This ensures strokes are never clipped and look professional.
    */
    .tech-chipped {
      position: relative;
      border: 1px solid rgba(0, 245, 255, 0.2);
    }

    .tech-chipped-red {
      position: relative;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .tech-chipped-inv {
      position: relative;
      border: 1px solid rgba(224, 246, 3, 0.2);
    }

    /* Decorative hatches and markers */
    .tech-hatch {
      background: repeating-linear-gradient(-45deg,
          rgba(0, 245, 255, 0.1),
          rgba(0, 245, 255, 0.1) 2px,
          transparent 2px,
          transparent 4px);
    }

    .tech-marker {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--cyan);
      box-shadow: 0 0 5px var(--cyan);
    }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.05);
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .custom-scrollbar::-webkit-scrollbar {

    .custom-scrollbar::-webkit-scrollbar-track {

    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 245, 255, 0.2);
    }

    @keyframes border-beam-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .hover-electric {
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      border: 1px solid rgba(0, 245, 255, 0.2) !important;
    }

    /* 1px Border Beam Animation using Masking */
    .hover-electric::before {
      content: '';
      position: absolute;
      inset: -1px;
      padding: 1px;
      background: conic-gradient(from 0deg,
          transparent 0%,
          transparent 80%,
          var(--cyan) 95%,
          transparent 100%);
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }

    /* Only initiate animation on hover or active state */
    .hover-electric:hover::before,
    .hover-electric.active::before {
      opacity: 1;
      animation: border-beam-spin 3s linear infinite;
    }

    /* Strong Cyan Glow on hover and active state */
    .hover-electric:hover,
    .hover-electric.active {
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.15), inset 0 0 20px rgba(0, 245, 255, 0.05);
      border-color: rgba(0, 245, 255, 0.5) !important;
    }

    @keyframes neural-reveal {
      0% {
        opacity: 0.1;
        transform: translateY(20px);
        filter: blur(8px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }

    @keyframes card-entrance {

        transform: translateY(30px);

      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes expand-hero {
      0% {
        transform: scaleX(0) scaleY(0);
        opacity: 0;
      }

      20% {
        transform: scaleX(1) scaleY(0);
        opacity: 1;
      }

      100% {
        transform: scaleX(1) scaleY(1);
        opacity: 1;
      }
    }

    @keyframes slide-fade-blur-in {
      0% {
        transform: translateY(20px);
        opacity: 0;
        filter: blur(10px);
      }

      100% {
        transform: translateY(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    .animate-expand-hero {
      animation: expand-hero 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
      transform-origin: top;
    }

    .animate-slide-fade-blur {

    }

    }

    .animate-card-entrance {

    }

    @keyframes scan-slow {

        transform: translateX(-100%);
      }

      100% {
        transform: translateX(100%);

    }

    .group:hover .group-hover\:animate-scan-slow {

    }

    @keyframes glitch-anim-1 {
      0% {
        clip-path: inset(50% 0 30% 0);
        transform: translate(-5px, 0);
      }

      20% {
        clip-path: inset(29% 0 1% 0);
        transform: translate(5px, 0);
      }

      40% {
        clip-path: inset(1% 0 99% 0);
        transform: translate(-5px, 0);
      }

      60% {

        transform: translate(10px, 0);
      }

      80% {
        clip-path: inset(70% 0 5% 0);
        transform: translate(-5px, 0);
      }

      100% {
        clip-path: inset(50% 0 30% 0);
        transform: translate(5px, 0);
      }
    }

    @keyframes glitch-anim-2 {
      0% {
        clip-path: inset(25% 0 58% 0);
        transform: translate(5px, 0);
      }

      20% {
        clip-path: inset(75% 0 5% 0);
        transform: translate(-5px, 0);
      }

      40% {

        transform: translate(5px, 0);
      }

      60% {

        transform: translate(-5px, 0);
      }

      80% {
        clip-path: inset(4% 0 95% 0);
        transform: translate(5px, 0);
      }

      100% {
        clip-path: inset(25% 0 58% 0);
        transform: translate(-5px, 0);
      }
    }

    @keyframes glitch-anim-flash {
      0% {
        opacity: 0;
        transform: translate(0);
      }

      10% {
        opacity: 0.5;
        transform: translate(-2px, 2px);
      }

      20% {
        opacity: 0;
        transform: translate(0);
      }

      100% {
        opacity: 0;
        transform: translate(0);
      }
    }

    .glitch-effect-1 {
      animation: glitch-anim-1 4s infinite linear alternate-reverse;
    }

    .glitch-effect-2 {
      animation: glitch-anim-2 6s infinite linear alternate-reverse;
    }

    .glitch-flash {
