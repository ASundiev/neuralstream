<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralStream AI - Neural Recommendation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: { 400: '#00f5ff', 500: '#00f5ff' },
            magenta: { 400: '#ff1388', 500: '#ff1388' },
            greenAcc: { 400: '#e0f603', 500: '#e0f603' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5ff;
      --magenta: #ff1388;
      --green: #e0f603;
      --deep: #020617;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--deep);
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .grid-overlay {
      background-image: 
        linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Reference-inspired tech borders */
    .tech-border {
      border: 1px solid rgba(0, 245, 255, 0.15);
      position: relative;
    }

    .tech-chipped {
      clip-path: polygon(
        8px 0%, 
        100% 0%, 
        100% calc(100% - 8px), 
        calc(100% - 8px) 100%, 
        0% 100%, 
        0% 8px
      );
    }

    .tech-chipped-inv {
      clip-path: polygon(
        0% 0%, 
        calc(100% - 8px) 0%, 
        100% 8px, 
        100% 100%, 
        8px 100%, 
        0% calc(100% - 8px)
      );
    }

    /* Decorative hatches and markers from the reference */
    .tech-hatch {
      background: repeating-linear-gradient(
        -45deg,
        rgba(0, 245, 255, 0.1),
        rgba(0, 245, 255, 0.1) 2px,
        transparent 2px,
        transparent 4px
      );
    }

    .tech-marker {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--cyan);
      box-shadow: 0 0 5px var(--cyan);
    }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.05);
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: var(--deep); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 245, 255, 0.2); }

    @keyframes border-beam-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hover-electric {
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    /* 1px Border Beam Animation */
    .hover-electric::before {
      content: '';
      position: absolute;
      top: -150%;
      left: -150%;
      width: 400%;
      height: 400%;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -2;
      pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0%, transparent 85%, var(--cyan) 95%, transparent 100%);
    }

    /* Only initiate animation on hover or active state */
    .hover-electric:hover::before, .hover-electric.active::before { 
      opacity: 1; 
      animation: border-beam-spin 3s linear infinite;
    }
    
    /* Strong Cyan Glow on hover and active state */
    .hover-electric:hover, .hover-electric.active {
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.1);
      border-color: rgba(0, 245, 255, 0.6) !important;
    }

    /* Internal background to keep the beam only on the border edge */
    .hover-electric::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--deep);
      z-index: -1;
      pointer-events: none;
      transition: background 0.3s ease;
    }

    @keyframes neural-reveal {
      0% { opacity: 0.1; transform: translateY(20px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes card-entrance {
      0% { opacity: 0.1; transform: translateY(30px); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .animate-neural-reveal {
      animation: neural-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-card-entrance {
      animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="grid-overlay">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
