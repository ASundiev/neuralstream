<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralStream AI - Neural Recommendation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cyan: { 400: '#00f5ff', 500: '#00f5ff' },
            magenta: { 400: '#ff1388', 500: '#ff1388' },
            greenAcc: { 400: '#e0f603', 500: '#e0f603' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5ff;
      --magenta: #ff1388;
      --green: #e0f603;
      --deep: #020617;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--deep);
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .grid-overlay {
      background-image: radial-gradient(rgba(0, 245, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .tech-border {
      border: 1px solid rgba(0, 245, 255, 0.15);
      position: relative;
    }
    
    .tech-border::before, .tech-border::after {
      content: '+';
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      opacity: 0.5;
    }
    .tech-border::before { top: -6px; left: -4px; }
    .tech-border::after { bottom: -6px; right: -4px; }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.1);
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }

    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: var(--deep); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 245, 255, 0.2); }
    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(0, 245, 255, 0.2) var(--deep); }

    @keyframes border-beam-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes steady-text-glow {
      0%, 100% { text-shadow: 0 0 8px rgba(0, 245, 255, 0.4); }
      50% { text-shadow: 0 0 15px rgba(0, 245, 255, 0.8); }
    }

    .hover-electric, .hover-electric-green {
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .hover-electric::before, .hover-electric-green::before {
      content: '';
      position: absolute;
      top: -150%;
      left: -150%;
      width: 400%;
      height: 400%;
      animation: border-beam-spin 3s linear infinite;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -2;
      pointer-events: none;
    }

    .hover-electric::before {
      background: conic-gradient(from 0deg, transparent 0%, transparent 80%, var(--cyan) 92%, transparent 100%);
    }

    .hover-electric-green::before {
      background: conic-gradient(from 0deg, transparent 0%, transparent 80%, var(--green) 92%, transparent 100%);
    }

    .hover-electric::after, .hover-electric-green::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--deep);
      z-index: -1;
      transition: background 0.3s ease;
    }

    .hover-electric:hover::before, .hover-electric-green:hover::before { opacity: 1; }
    
    .hover-electric { border: 1px solid rgba(0, 245, 255, 0.15) !important; }
    .hover-electric:hover {
      border-color: rgba(0, 245, 255, 0.4) !important;
      background: rgba(0, 245, 255, 0.02);
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.1);
    }

    .hover-electric-green { border: 1px solid rgba(224, 246, 3, 0.15) !important; }
    .hover-electric-green:hover {
      border-color: rgba(224, 246, 3, 0.4) !important;
      background: rgba(224, 246, 3, 0.02);
      box-shadow: 0 0 30px rgba(224, 246, 3, 0.1);
    }

    .perspective-1000 {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }

    @keyframes neural-reveal {
      0% { opacity: 0.1; transform: translateY(20px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes card-entrance {
      0% { opacity: 0.1; transform: translateY(30px); filter: blur(10px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .animate-neural-reveal {
      animation: neural-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-card-entrance {
      animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="grid-overlay">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
