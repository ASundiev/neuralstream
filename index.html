
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralStream AI - Neural Recommendation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5ff;
      --deep: #020617;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--deep);
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .grid-overlay {
      background-image: radial-gradient(rgba(0, 245, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .tech-border {
      border: 1px solid rgba(0, 245, 255, 0.15);
      position: relative;
    }
    
    .tech-border::before, .tech-border::after {
      content: '+';
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      opacity: 0.5;
    }
    .tech-border::before { top: -6px; left: -4px; }
    .tech-border::after { bottom: -6px; right: -4px; }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.1);
      position: absolute;
      z-index: 10;
      pointer-events: none;
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      from { top: 0; }
      to { top: 100%; }
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }
    
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--deep); }
    ::-webkit-scrollbar-thumb { background: rgba(0, 245, 255, 0.2); }

    /* HUD Animations */
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes orbit-rev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      33% { opacity: 0.8; }
      66% { opacity: 0.9; }
      70% { opacity: 0.2; }
    }
    .animate-orbit { animation: orbit 10s linear infinite; }
    .animate-orbit-rev { animation: orbit-rev 15s linear infinite; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
    .animate-flicker { animation: flicker 0.1s linear infinite; }
  </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.48.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="grid-overlay">
  <div id="root"></div>
</body>
</html>
