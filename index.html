
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuralStream AI - Neural Recommendation Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cyan: #00f5ff;
      --deep: #020617;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--deep);
      color: #f8fafc;
      overflow-x: hidden;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .grid-overlay {
      background-image: radial-gradient(rgba(0, 245, 255, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .tech-border {
      border: 1px solid rgba(0, 245, 255, 0.15);
      position: relative;
    }
    
    .tech-border::before, .tech-border::after {
      content: '+';
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--cyan);
      opacity: 0.5;
    }
    .tech-border::before { top: -6px; left: -4px; }
    .tech-border::after { bottom: -6px; right: -4px; }

    .scanline {
      width: 100%;
      height: 2px;
      background: rgba(0, 245, 255, 0.1);
      position: absolute;
      z-index: 10;
      pointer-events: none;
      animation: scan 4s linear infinite;
    }

    @keyframes scan {
      from { top: 0; }
      to { top: 100%; }
    }

    .glass-dark {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
    }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: var(--deep); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 245, 255, 0.2); }
    .custom-scrollbar { scrollbar-width: thin; scrollbar-color: rgba(0, 245, 255, 0.2) var(--deep); }

    @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbit-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    .animate-orbit { animation: orbit 10s linear infinite; }
    .animate-orbit-rev { animation: orbit-rev 15s linear infinite; }
    .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

    @keyframes border-beam-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes steady-text-glow {
      0%, 100% { text-shadow: 0 0 8px rgba(0, 245, 255, 0.4); }
      50% { text-shadow: 0 0 15px rgba(0, 245, 255, 0.8); }
    }

    .hover-electric {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 245, 255, 0.15) !important;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .hover-electric::before {
      content: '';
      position: absolute;
      top: -150%;
      left: -150%;
      width: 400%;
      height: 400%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        transparent 80%,
        var(--cyan) 92%,
        transparent 100%
      );
      animation: border-beam-spin 3s linear infinite;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -2;
      pointer-events: none;
    }

    .hover-electric::after {
      content: '';
      position: absolute;
      inset: 1px;
      background: var(--deep);
      z-index: -1;
      transition: background 0.3s ease;
    }

    .hover-electric:hover::before {
      opacity: 1;
    }

    .hover-electric:hover {
      border-color: rgba(0, 245, 255, 0.4) !important;
      background: rgba(0, 245, 255, 0.02);
      box-shadow: 0 0 30px rgba(0, 245, 255, 0.1);
    }

    .hover-electric:hover .glitch-text {
      animation: steady-text-glow 2s ease-in-out infinite;
      color: #fff;
    }

    /* Entrance Animations */
    @keyframes neural-reveal {
      0% { 
        opacity: 0.1; 
        transform: translateY(20px); 
        filter: blur(8px); 
      }
      100% { 
        opacity: 1; 
        transform: translateY(0); 
        filter: blur(0); 
      }
    }

    @keyframes card-entrance {
      0% {
        opacity: 0.1;
        transform: translateY(30px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .animate-neural-reveal {
      animation: neural-reveal 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .animate-card-entrance {
      animation: card-entrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",

    "vite": "https://esm.sh/vite@^7.3.0",

  }
}
</script>
</head>
<body class="grid-overlay">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
